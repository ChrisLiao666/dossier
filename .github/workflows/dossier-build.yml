name: Build Dossier with qualifications heading

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dossier-build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dossier v1.10.0
        uses: actions/checkout@v4
        with:
          repository: AienTech/dossier
          ref: v1.10.0
      - name: Change English education heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/document-labels.ts')
          text = p.read_text()
          old = 'education: "Education",'
          assert text.count(old) == 1, 'Expected exactly one English heading'
          p.write_text(text.replace(old, 'education: "Education and Qualifications",'))
          PY
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dossier-custom" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:v1.10.0-qualifications
          cache-from: type=gha
          cache-to: type=gha,mode=max
